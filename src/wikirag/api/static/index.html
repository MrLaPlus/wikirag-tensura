    }

    .dark .markdown-body { color: #faf9f5; }
    .markdown-body p { margin-bottom: 0.75rem; line-height: 1.7; }
    .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }

      margin-top: 1rem;

    }
    .dark .markdown-body h1, .dark .markdown-body h2, .dark .markdown-body h3 {

    }

    .markdown-body a { color: #a9583e; text-decoration: underline; text-underline-offset: 2px; }
    .dark .markdown-body a { color: #e8a55a; }
    input::placeholder { color: #6c6a64; opacity: 1; }
    .dark input::placeholder { color: #b8b4aa; opacity: 1; }
    .markdown-body code { 
      font-family: 'JetBrains Mono', monospace; 
      background: #efe9de; 
      color: #141413;
      padding: 0.15rem 0.35rem; 
      border-radius: 4px; 
      font-size: 0.875em; 
    }
    .dark .markdown-body code {
      background: #252320;
      color: #faf9f5;
    }
    .markdown-body pre code { 
      display: block; 
      padding: 0.75rem; 
      overflow-x: auto; 
      background: #181715;
      color: #faf9f5;
    }
    .workspace-grid { grid-template-columns: 256px minmax(0, 1fr) 360px; }
    @media (max-width: 1100px) { .workspace-grid { grid-template-columns: 224px minmax(0, 1fr); } }
    @media (max-width: 1023px) { .workspace-grid { grid-template-columns: minmax(0, 1fr); } }

    .soft-focus { box-shadow: 0 1px 3px rgba(20,20,19,0.08); }

</head>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Anthropic signature 4-spoke starburst / radial spike icon
    const AnthropicSpike = ({ className = "w-4 h-4 fill-current" }) => (

    const I18N = {
      en: {

      th: {

        chat: "ถาม-ตอบ (Chat)",
        entities: "สำรวจตัวละคร (Entities)",
        graph: "โครงข่ายความสัมพันธ์ (Graph)",
        admin: "ผู้ดูแลระบบ (Sync)",
        settings: "ตั้งค่าระบบ",
        placeholder: "ถามคำถามเกี่ยวกับริมุรุ สกิล หรือเนื้อเรื่อง (ภาษาไทยหรืออังกฤษก็ได้)...",
        send: "ส่งคำถาม",

        syncNow: "เริ่ม Sync อัปเดตข้อมูล (Incremental)",

        cachedEmbeddings: "เวกเตอร์ในแคช (Disk)",
        relationships: "ความสัมพันธ์ในกราฟ",
        stageTitle: "ขั้นตอนการทำงานปัจจุบัน",
        pipelineStages: "ขั้นตอนการประมวลผล",
        syncStatus: "สถานะการดึงข้อมูล",
        totalArticles: "บทความทั้งหมด",
        totalChunks: "เวกเตอร์ในระบบ (LanceDB)",
        llmProvider: "ผู้ให้บริการ LLM",
        modelName: "ชื่อโมเดล",
        apiKey: "API Key (OpenRouter / OpenAI / Gemini)",
        embeddingEngine: "ระบบประมวลผล Embedding",
        quantization: "การบีบอัดโมเดล (Quantization)",
        topK: "จำนวน Chunks ที่ค้นหา (Top-K)",
        enableRerank: "เปิดใช้งาน Reranker จัดอันดับซ้ำ",
        enableBM25: "เปิดใช้งาน BM25 ค้นหาแบบไฮบริด",
        temperature: "ความสร้างสรรค์ (Temperature)",
        save: "บันทึกการตั้งค่า",
        licenseNotice: "ข้อมูลดึงมาจาก Tensura Fandom Wiki ภายใต้สัญญาอนุญาต CC BY-SA 3.0",
        searchEntity: "ค้นหาตัวละคร / หน้า...",
        viewDetail: "ดูข้อมูล Infobox",
      }
    };

    const LLM_MODEL_PRESETS = {
      openrouter: ['minimax/minimax-m3:free', 'google/gemma-4-31b-it:free', 'meta-llama/llama-3.1-8b-instruct:free'],
      ollama: ['llama3.1:8b', 'qwen2.5:7b', 'gemma3:4b'],
      gemini: ['gemini-2.5-flash', 'gemini-2.5-pro'],
      openai: ['gpt-4o-mini', 'gpt-4.1-mini'],
      anthropic: ['claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022'],
      lmstudio: [],
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('wikirag_language') || 'en');
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('wikirag_dark_mode') === 'true');
      const [tab, setTab] = useState(() => {
        const saved = localStorage.getItem('wikirag_active_tab');
        return ['chat', 'entities', 'graph', 'admin'].includes(saved) ? saved : 'chat';
      }); // 'chat' | 'entities' | 'graph' | 'admin'
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [providerTestStatus, setProviderTestStatus] = useState(null);
      const settingsFileInputRef = useRef(null);

      // Settings state (with localStorage persistence)
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('wikirag_settings');
        if (saved) {
          try { const parsed = JSON.parse(saved); return {...parsed, enableReranking: parsed.enableReranking === true, enableRetry: parsed.enableRetry !== false, verificationMode: parsed.verificationMode || 'off', verificationStrictness: parsed.verificationStrictness || 'balanced',
            embeddingModel: parsed.embeddingModel || 'BAAI/bge-m3', embeddingDevice: parsed.embeddingDevice || 'cpu', embeddingBatchSize: parsed.embeddingBatchSize || 8,
            rerankerModel: parsed.rerankerModel || 'BAAI/bge-reranker-v2-m3', chunkMinTokens: parsed.chunkMinTokens || 400, chunkMaxTokens: parsed.chunkMaxTokens || 800,
            chunkOverlap: parsed.chunkOverlap ?? 15, crawlerBatchSize: parsed.crawlerBatchSize || 50, crawlerDelay: parsed.crawlerDelay ?? 0.5,
            crawlerCheckpoint: parsed.crawlerCheckpoint || 100, storageDataDir: parsed.storageDataDir || './data/tensura',
            storageVectorDir: parsed.storageVectorDir || './data/tensura/vectordb', storageRawDir: parsed.storageRawDir || './data/tensura/raw'}; } catch (e) {}
        }
        return {
          provider: 'openrouter',
          model: 'minimax/minimax-m3:free',
          fallbackModel: '',
          enableRetry: true,
          verificationMode: 'off',
          verificationStrictness: 'balanced',
          verifyNumbers: true, verifyNames: true, verifySkillRanks: true, verifyRelationships: true, verifyCitations: true, verifyUnsupported: true,
           apiKey: '',
           baseUrl: '',
          embeddingBackend: 'onnx',
          quantization: 'int8',
          topK: 5,
          enableReranking: false,
          enableBM25: false,
           temperature: 0.1,
           maxTokens: 1024,
          systemPrompt: '',
          embeddingModel: 'BAAI/bge-m3',
          embeddingDevice: 'cpu',
          embeddingBatchSize: 8,
          rerankerModel: 'BAAI/bge-reranker-v2-m3',
          chunkMinTokens: 400,
          chunkMaxTokens: 800,
          chunkOverlap: 15,
          crawlerBatchSize: 50,
          crawlerDelay: 0.5,
          crawlerCheckpoint: 100,
          storageDataDir: './data/tensura',
          storageVectorDir: './data/tensura/vectordb',
          storageRawDir: './data/tensura/raw',
        };
      });

      const [conversations, setConversations] = useState([]);
      const [conversationId, setConversationId] = useState(null);
      const [historyLoading, setHistoryLoading] = useState(false);
      const [historySearch, setHistorySearch] = useState('');

      const fetchConversations = async () => {
        try {
          const res = await fetch('/api/conversations?project=tensura');
          if (res.ok) setConversations(await res.json());
        } catch (e) { console.error('Failed to load chat history', e); }
      };

      const createNewChat = async () => {
        try {
          const res = await fetch('/api/conversations', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({project: 'tensura', title: lang === 'th' ? 'แชทใหม่' : 'New chat', llm_provider: settings.provider, llm_model: settings.model})
          });
          if (!res.ok) throw new Error('Failed to create conversation');
          const data = await res.json();
          setConversationId(data.id);
          setMessages([]); setActiveSources([]);
          fetchConversations();
        } catch (e) { console.error(e); }
      };

      const openConversation = async (id) => {
        setHistoryLoading(true);
        try {
          const res = await fetch(`/api/conversations/${encodeURIComponent(id)}`);
          if (!res.ok) throw new Error('Failed to load conversation');
          const data = await res.json();
          setConversationId(data.id);
          setMessages((data.messages || []).map(m => ({id: m.id, role: m.role, content: m.content, sources: m.citations || [], verification: m.verification && Object.keys(m.verification).length ? m.verification : undefined, revisedAnswer: m.verification?.suggested_answer || ''})));
          setActiveSources([]);
          setTab('chat');
        } catch (e) { console.error(e); }
        finally { setHistoryLoading(false); }
      };

      const deleteConversation = async (id) => {
        if (!confirm(lang === 'th' ? 'ลบประวัติแชทนี้หรือไม่?' : 'Delete this chat?')) return;
        await fetch(`/api/conversations/${encodeURIComponent(id)}`, {method: 'DELETE'});
        if (conversationId === id) createNewChat();
        fetchConversations();
      };

      const handleSaveSettings = async () => {
        const numericSettings = {
          embeddingBatchSize: Number(settings.embeddingBatchSize),
          chunkMinTokens: Number(settings.chunkMinTokens),
          chunkMaxTokens: Number(settings.chunkMaxTokens),
          chunkOverlap: Number(settings.chunkOverlap),
          crawlerBatchSize: Number(settings.crawlerBatchSize),
          crawlerDelay: Number(settings.crawlerDelay),
          crawlerCheckpoint: Number(settings.crawlerCheckpoint),
        };
        if (numericSettings.embeddingBatchSize < 1 || numericSettings.embeddingBatchSize > 64 ||
            numericSettings.chunkMinTokens < 100 || numericSettings.chunkMaxTokens < numericSettings.chunkMinTokens ||
            numericSettings.chunkOverlap < 0 || numericSettings.chunkOverlap > 50 ||
            numericSettings.crawlerBatchSize < 1 || numericSettings.crawlerDelay < 0 || numericSettings.crawlerCheckpoint < 1) {
          alert(lang === 'th' ? 'กรุณาตรวจสอบค่าขั้นสูง: ตัวเลขอยู่นอกช่วงหรือ Chunk ต่ำ/สลับช่วง' : 'Please check advanced settings: invalid numeric range or chunk size.');
          return;
        }
        const embeddingChanged = settings.embeddingModel !== (settings._savedEmbeddingModel || 'BAAI/bge-m3') || settings.embeddingDevice !== (settings._savedEmbeddingDevice || 'cpu');
        const storageChanged = settings.storageDataDir !== './data/tensura' || settings.storageVectorDir !== './data/tensura/vectordb';
        if ((embeddingChanged || storageChanged) && !confirm(lang === 'th'
          ? 'การเปลี่ยน Embedding Model/Device หรือ Storage อาจทำให้ต้อง Restart และสร้างดัชนีใหม่ ต้องการบันทึกต่อหรือไม่?'
          : 'Changing Embedding Model/Device or Storage may require a restart and re-index. Save anyway?')) return;
        const nextSettings = {...settings, ...numericSettings, _savedEmbeddingModel: settings.embeddingModel, _savedEmbeddingDevice: settings.embeddingDevice};
        localStorage.setItem('wikirag_settings', JSON.stringify(nextSettings));
        try {
          await fetch('/api/settings?project=tensura', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(nextSettings)});
        } catch (e) { console.error('Failed to persist settings', e); }
        try {
          await fetch('/api/settings/embedding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              backend: settings.embeddingBackend,
              quantization: settings.quantization,
              model_name: settings.embeddingModel,
              device: settings.embeddingDevice,
              batch_size: numericSettings.embeddingBatchSize,
            })
          });
        } catch (e) {
          console.error("Failed to update embedding settings", e);
        }
        setIsSettingsOpen(false);
      };

      const testProvider = async () => {
        setProviderTestStatus('testing');
        try {
          const res = await fetch('/api/llm/test', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(settings)});
          setProviderTestStatus(res.ok ? 'ok' : 'error');
        } catch (e) {
          setProviderTestStatus('error');
        }
      };

      const exportSettings = () => {
        const safeSettings = {...settings, apiKey: undefined};
        const blob = new Blob([JSON.stringify(safeSettings, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = 'wikirag-settings.json'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const importSettings = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const imported = JSON.parse(await file.text());
          setSettings(prev => ({...prev, ...imported, apiKey: prev.apiKey || ''}));
          alert(lang === 'th' ? 'นำเข้าการตั้งค่าแล้ว กรุณากดบันทึกและใช้ค่า' : 'Settings imported. Click Save Settings to apply.');
        } catch (e) { alert(lang === 'th' ? 'ไฟล์การตั้งค่าไม่ถูกต้อง' : 'Invalid settings file'); }
        event.target.value = '';
      };

      const exportChat = () => {
        const content = messages.map(m => `## ${m.role === 'user' ? 'User' : 'WikiRAG'}\n\n${m.content || ''}`).join('\n\n');
        const blob = new Blob([content], {type: 'text/markdown;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = `wikirag-chat-${new Date().toISOString().slice(0, 10)}.md`; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const clearChatHistory = async () => {
        if (!conversations.length || !confirm(lang === 'th' ? 'ลบประวัติแชททั้งหมดหรือไม่?' : 'Delete all chat history?')) return;
        await Promise.all(conversations.map(c => fetch(`/api/conversations/${encodeURIComponent(c.id)}`, {method: 'DELETE'})));
        setConversations([]); setConversationId(null); setActiveSources([]);
        setMessages([{role: 'assistant', content: lang === 'th' ? 'เริ่มแชทใหม่ได้เลยครับ' : 'Start a new chat whenever you are ready.', sources: []}]);
      };

      const resetAdvancedSettings = () => {
        if (!confirm(lang === 'th' ? 'คืนค่าการตั้งค่าขั้นสูงเป็นค่าเริ่มต้นหรือไม่?' : 'Reset advanced settings to defaults?')) return;
        setSettings({...settings, embeddingModel: 'BAAI/bge-m3', embeddingDevice: 'cpu', embeddingBatchSize: 8,
          rerankerModel: 'BAAI/bge-reranker-v2-m3', chunkMinTokens: 400, chunkMaxTokens: 800, chunkOverlap: 15,
          crawlerBatchSize: 50, crawlerDelay: 0.5, crawlerCheckpoint: 100,
          storageDataDir: './data/tensura', storageVectorDir: './data/tensura/vectordb', storageRawDir: './data/tensura/raw'});
      };


      // Chat state
      const [messages, setMessages] = useState([
        {
          role: 'assistant',
          content: lang === 'th' 
            ? "ยินดีต้อนรับสู่ **WikiRAG** ฐานความรู้วรรณกรรมและข้อมูลเชิงลึกของ *That Time I Got Reincarnated as a Slime* (Tensura)\n\nคุณสามารถสอบถามประวัติศาสตร์ตัวละคร พลังสกิล ความสัมพันธ์ หรือเหตุการณ์สำคัญในเรื่องเป็นภาษาไทยหรืออังกฤษได้เลยครับ"
            : "Welcome to **WikiRAG** — the editorial knowledge partner for *That Time I Got Reincarnated as a Slime* (Tensura).\n\nFeel free to explore characters, skill evolutions, alliances, or lore in Thai or English.",
          sources: []
        }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const [chatMetrics, setChatMetrics] = useState(null);
      const [activeSources, setActiveSources] = useState([]);
      const [editingIndex, setEditingIndex] = useState(null);
      const abortControllerRef = useRef(null);
      const messagesEndRef = useRef(null);
      const messagesScrollRef = useRef(null);

      const getRankScore = (entity) => {

          ['extra', 600], ['rare', 500], ['s', 400], ['a', 300], ['b', 200],
          ['c', 100], ['d', 50], ['e', 25], ['f', 10],
        ];
        const scoreByLabel = Object.fromEntries(rankOrder);
        const matched = rankOrder.find(([label]) => new RegExp(`\\b${label}\\b`).test(rank));
        const numeric = rank.match(/\d+(?:\.\d+)?/);
        return matched ? scoreByLabel[matched[0]] : (numeric ? Number(numeric[0]) : -1);

      const exportGraph = (format) => {

      const visibleGraphData = useMemo(() => {
        const query = graphSearch.trim().toLowerCase();
        const nodes = graphData.nodes.filter(n => {
          const type = String(n.entity_type || '').toLowerCase();
          const matchesType = graphTypeFilter === 'all' || type === graphTypeFilter;
          const matchesSearch = !query || String(n.name || n.id || '').toLowerCase().includes(query);

        const nodeIds = new Set(nodes.map(n => n.id));
        const edges = graphData.edges.filter(e => {

      }, [graphData, graphTypeFilter, graphRelationFilter, graphSearch]);

      // Lightweight force simulation for graph
      useEffect(() => {
        if (tab !== 'graph' || !canvasRef.current || visibleGraphData.nodes.length === 0) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let width = (canvas.width = canvas.parentElement.clientWidth);
        let height = (canvas.height = canvas.parentElement.clientHeight);

        const nodes = visibleGraphData.nodes.map((n, i) => ({
          ...n,
          x: graphSearch && String(n.name || n.id).toLowerCase().includes(graphSearch.toLowerCase()) ? width / 2 : width * ({character: 0.25, skill: 0.5, location: 0.75}[n.entity_type] || 0.5) + (Math.random() - 0.5) * 120,
          y: graphSearch && String(n.name || n.id).toLowerCase().includes(graphSearch.toLowerCase()) ? height / 2 : height / 2 + (Math.random() - 0.5) * (height * 0.7),
          vx: 0,
          vy: 0,
          radius: n.entity_type === 'character' ? 14 : 10,
          color: n.entity_type === 'character' ? '#cc785c' : n.entity_type === 'location' ? '#e8a55a' : '#5db8a6'
        }));

        const nodeMap = new Map(nodes.map(n => [n.id, n]));
        const edges = visibleGraphData.edges
          .map(e => ({ ...e, sourceNode: nodeMap.get(e.source), targetNode: nodeMap.get(e.target) }))
          .filter(e => e.sourceNode && e.targetNode);

        let animationId;
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let simulationTicks = 0;
        let pointerDown = null;
        let draggedNode = null;
        let didDrag = false;
        const getCanvasPoint = (event) => {
          const rect = canvas.getBoundingClientRect();
          return { x: (event.clientX - rect.left - panX) / zoom, y: (event.clientY - rect.top - panY) / zoom };
        };
        const getScreenPoint = (event) => {
          const rect = canvas.getBoundingClientRect();
          return { x: event.clientX - rect.left, y: event.clientY - rect.top };
        };
        const findNodeAt = (point) => [...nodes].reverse().find(n => {
          const dx = point.x - n.x;
          const dy = point.y - n.y;
          return Math.sqrt(dx * dx + dy * dy) <= n.radius + 8;
        });
        const distanceToSegment = (point, start, end) => {
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const lengthSquared = dx * dx + dy * dy || 1;
          const t = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSquared));
          const nearX = start.x + t * dx;
          const nearY = start.y + t * dy;
          return Math.hypot(point.x - nearX, point.y - nearY);
        };
        const findEdgeAt = (point) => [...edges].reverse().find(e => distanceToSegment(point, e.sourceNode, e.targetNode) <= 8);
        const render = () => {
          if (simulationTicks < 240) {
            for (let i = 0; i < nodes.length; i++) {
              for (let j = i + 1; j < nodes.length; j++) {
                let dx = nodes[j].x - nodes[i].x;
                let dy = nodes[j].y - nodes[i].y;
                let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                if (dist < 120) {
                  let force = (120 - dist) / 120 * 0.5;
                  nodes[i].vx -= (dx / dist) * force;
                  nodes[i].vy -= (dy / dist) * force;
                  nodes[j].vx += (dx / dist) * force;
                  nodes[j].vy += (dy / dist) * force;
                }
              }
            }

            for (const e of edges) {
              let dx = e.targetNode.x - e.sourceNode.x;
              let dy = e.targetNode.y - e.sourceNode.y;
              let dist = Math.sqrt(dx * dx + dy * dy) || 1;
              let force = (dist - 80) * 0.01;
              e.sourceNode.vx += (dx / dist) * force;
              e.sourceNode.vy += (dy / dist) * force;
              e.targetNode.vx -= (dx / dist) * force;
              e.targetNode.vy -= (dy / dist) * force;
            }

            for (const n of nodes) {
              n.x += n.vx;
              n.y += n.vy;
              n.vx *= 0.85;
              n.vy *= 0.85;
              n.x = Math.max(n.radius, Math.min(width - n.radius, n.x));
              n.y = Math.max(n.radius, Math.min(height - n.radius, n.y));
            }
            simulationTicks += 1;
          }

          ctx.clearRect(0, 0, width, height);
          ctx.save();
          ctx.translate(panX, panY);
          ctx.scale(zoom, zoom);

          ctx.lineWidth = 1;
          for (const e of edges) {
            const edgeActive = graphHoverRef.current && (e === graphHoverRef.current || e.source === graphHoverRef.current.source || e.target === graphHoverRef.current.target);
            ctx.strokeStyle = edgeActive ? '#cc785c' : (darkMode ? 'rgba(230,223,216,0.15)' : 'rgba(20,20,19,0.12)');
            ctx.lineWidth = edgeActive ? 2 : 1;
            ctx.beginPath();
            ctx.moveTo(e.sourceNode.x, e.sourceNode.y);
            ctx.lineTo(e.targetNode.x, e.targetNode.y);
            ctx.stroke();

            let midX = (e.sourceNode.x + e.targetNode.x) / 2;
            let midY = (e.sourceNode.y + e.targetNode.y) / 2;
            if (graphShowLabels) {
              ctx.fillStyle = darkMode ? '#a09d96' : '#6c6a64';
              ctx.font = '10px Inter, sans-serif';
              ctx.fillText(e.relation_type, midX, midY);
            }
          }

          for (const n of nodes) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius, 0, 2 * Math.PI);
            ctx.fillStyle = n.color;
            ctx.fill();
            ctx.strokeStyle = darkMode ? '#181715' : '#faf9f5';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (graphShowLabels) {
              ctx.fillStyle = darkMode ? '#faf9f5' : '#141413';
              ctx.font = '500 11px Inter, sans-serif';
              ctx.fillText(n.name, n.x + n.radius + 5, n.y + 4);
            }
          }
          ctx.restore();

          animationId = requestAnimationFrame(render);
        };

        render();

        const handlePointerDown = (event) => {
          const screenPoint = getScreenPoint(event);
          pointerDown = screenPoint;
          draggedNode = findNodeAt(getCanvasPoint(event));
          didDrag = false;
          canvas.setPointerCapture?.(event.pointerId);
          canvas.style.cursor = draggedNode ? 'grabbing' : 'move';
        };
        const handlePointerMove = (event) => {
          const screenPoint = getScreenPoint(event);
          const point = getCanvasPoint(event);
          const hoveredEdge = findEdgeAt(point) || null;
          graphHoverRef.current = hoveredEdge;
          setGraphHover(hoveredEdge);
          if (!pointerDown) {
            canvas.style.cursor = findNodeAt(point) ? 'pointer' : 'grab';
            return;
          }
          if (Math.abs(screenPoint.x - pointerDown.x) + Math.abs(screenPoint.y - pointerDown.y) > 4) didDrag = true;
          if (draggedNode) {
            draggedNode.x = Math.max(draggedNode.radius, Math.min(width - draggedNode.radius, point.x));
            draggedNode.y = Math.max(draggedNode.radius, Math.min(height - draggedNode.radius, point.y));
            draggedNode.vx = 0;
            draggedNode.vy = 0;
          } else {
            panX += screenPoint.x - pointerDown.x;
            panY += screenPoint.y - pointerDown.y;
            pointerDown = screenPoint;
          }
        };
        const handlePointerUp = (event) => {
          const point = getCanvasPoint(event);
          const clickedNode = !didDrag && findNodeAt(point);
          const clickedEdge = !didDrag && !clickedNode && findEdgeAt(point);
          if (clickedNode) fetchEntityDetail(clickedNode.name);
          if (clickedEdge) setSelectedRelationship(clickedEdge);
          pointerDown = null;
          draggedNode = null;
          canvas.style.cursor = clickedNode ? 'pointer' : 'grab';
          canvas.releasePointerCapture?.(event.pointerId);
        };
        const handleWheel = (event) => {
          event.preventDefault();
          const screenPoint = getScreenPoint(event);
          const oldZoom = zoom;
          zoom = Math.max(0.25, Math.min(3.5, zoom * (event.deltaY < 0 ? 1.1 : 0.9)));
          panX = screenPoint.x - ((screenPoint.x - panX) / oldZoom) * zoom;
          panY = screenPoint.y - ((screenPoint.y - panY) / oldZoom) * zoom;
        };
        const handlePointerLeave = () => {
          if (!pointerDown) canvas.style.cursor = 'grab';
        };
        const handleDoubleClick = (event) => {
          const node = findNodeAt(getCanvasPoint(event));
          if (node) fetchEntityDetail(node.name);
        };
        canvas.addEventListener('pointerdown', handlePointerDown);
        canvas.addEventListener('pointermove', handlePointerMove);
        canvas.addEventListener('pointerup', handlePointerUp);
        canvas.addEventListener('pointerleave', handlePointerLeave);
        canvas.addEventListener('dblclick', handleDoubleClick);
        canvas.addEventListener('wheel', handleWheel, { passive: false });
        canvas.style.cursor = 'grab';

        return () => {
          cancelAnimationFrame(animationId);
          canvas.removeEventListener('pointerdown', handlePointerDown);
          canvas.removeEventListener('pointermove', handlePointerMove);
          canvas.removeEventListener('pointerup', handlePointerUp);
          canvas.removeEventListener('pointerleave', handlePointerLeave);
          canvas.removeEventListener('dblclick', handleDoubleClick);
          canvas.removeEventListener('wheel', handleWheel);
        };
      }, [tab, visibleGraphData, graphSearch, darkMode, graphViewReset, graphShowLabels]);

        const verifyAnswer = async (query, answer, sources, messageId) => {
        if (!answer || settings.verificationMode === 'off') return;
        setMessages(prev => prev.map((m, i) => i === prev.length - 1 ? {...m, verification: {status: 'running'}} : m));
        try {
          const res = await fetch('/api/chat/verify', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({query, answer, sources, message_id: messageId, conversation_id: conversationId, project: 'tensura', llm_provider: settings.provider, llm_model: settings.model, api_key: settings.apiKey || undefined, base_url: settings.baseUrl || undefined, verification_strictness: settings.verificationStrictness, verify_numbers: settings.verifyNumbers, verify_names: settings.verifyNames, verify_skill_ranks: settings.verifySkillRanks, verify_relationships: settings.verifyRelationships, verify_citations: settings.verifyCitations, verify_unsupported: settings.verifyUnsupported})});
          const result = res.ok ? await res.json() : {overall: 'insufficient_evidence', summary: 'Verification failed'};
          setMessages(prev => prev.map((m, i) => i === prev.length - 1 ? {...m, verification: result, revisedAnswer: settings.verificationMode !== 'verify_only' ? result.suggested_answer : ''} : m));
        } catch (error) { setMessages(prev => prev.map((m, i) => i === prev.length - 1 ? {...m, verification: {overall: 'insufficient_evidence', summary: error.message}} : m)); }
      };

      // Handle Streaming Chat via SSE
      const handleSendMessage = async (e, overrideQuery = null) => {
        e?.preventDefault();
        const candidateQuery = overrideQuery !== null ? overrideQuery : inputQuery;
        if (!candidateQuery.trim() || isStreaming) return;

        const userMsg = candidateQuery.trim();
        setInputQuery('');
        if (editingIndex !== null) {
          setMessages(prev => [...prev.slice(0, editingIndex), { role: 'user', content: userMsg }]);
          setEditingIndex(null);
        } else {
          setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
        }
        setIsStreaming(true);
        setActiveSources([]);
        const startedAt = performance.now();
        let streamedText = '';
        let currentSources = [];
        let savedMessageId = null;
        setChatMetrics({status: 'running'});

        setMessages(prev => [...prev, { role: 'assistant', content: '', sources: [] }]);

        try {
          abortControllerRef.current = new AbortController();
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: abortControllerRef.current.signal,
              body: JSON.stringify({
                message: userMsg,
                conversation_id: conversationId,
              project: 'tensura',
              llm_provider: settings.provider,
               llm_model: settings.model,
               fallback_model: settings.fallbackModel || undefined,
               enable_retry: settings.enableRetry !== false,
               api_key: settings.apiKey || undefined,
               base_url: settings.baseUrl || undefined,
               max_output_tokens: parseInt(settings.maxTokens) || 1024,
               system_prompt: settings.systemPrompt || undefined,
              top_k: parseInt(settings.topK),
              enable_reranking: settings.enableReranking,
              enable_bm25: settings.enableBM25,
              reranker_model: settings.rerankerModel || undefined,
               temperature: parseFloat(settings.temperature),
              verification_mode: settings.verificationMode || 'off',
              verification_strictness: settings.verificationStrictness || 'balanced',
              verify_numbers: settings.verifyNumbers !== false, verify_names: settings.verifyNames !== false, verify_skill_ranks: settings.verifySkillRanks !== false,
              verify_relationships: settings.verifyRelationships !== false, verify_citations: settings.verifyCitations !== false, verify_unsupported: settings.verifyUnsupported !== false,
            })

          });

          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n');
            buffer = lines.pop();

            for (const block of lines) {
              if (!block.trim()) continue;
              const matchEvent = block.match(/event:\s*(\w+)/);
              const matchData = block.match(/data:\s*(.+)/s);

              const eventType = matchEvent ? matchEvent[1] : 'message';
              const eventData = matchData ? matchData[1] : '';

              if (eventType === 'sources') {
                try {
                  currentSources = JSON.parse(eventData);
                  setActiveSources(currentSources);
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1].sources = currentSources;
                    return next;
                  });
                } catch (err) {
                  console.error("Failed to parse sources", err);
                  }
              } else if (eventType === 'conversation') {
                try { setConversationId(JSON.parse(eventData).id); fetchConversations(); } catch (err) { console.error(err); }
              } else if (eventType === 'fallback') {
                try { const fallback = JSON.parse(eventData); setMessages(prev => { const next = [...prev]; next[next.length - 1].fallbackModel = fallback.model; return next; }); } catch (err) {}
              } else if (eventType === 'token') {
                try {
                  const tokenObj = JSON.parse(eventData);
                  streamedText += tokenObj.token || '';
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1].content += tokenObj.token;
                    return next;
                  });
                } catch (err) {
                  console.error("Token parse error", err);
                }
              } else if (eventType === 'message_saved') {
                try { savedMessageId = JSON.parse(eventData).id; } catch (err) {}
              } else if (eventType === 'error') {
                try {
                  const errObj = JSON.parse(eventData);
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1].content += `\n\n*(Error: ${errObj.error})*`;
                    return next;
                  });
                } catch (e) {}
              }
            }
          }
          if (streamedText && settings.verificationMode !== 'off') verifyAnswer(userMsg, streamedText, currentSources, savedMessageId);
        } catch (error) {
          if (error.name === 'AbortError') {
            setMessages(prev => {
              const next = [...prev];
              if (next.length && next[next.length - 1].role === 'assistant') next[next.length - 1].content += '\n\n*(หยุดการตอบแล้ว)*';
              return next;
            });
            return;
          }
          setMessages(prev => {
            const next = [...prev];
            next[next.length - 1].content = `Connection Error: ${error.message}`;
            return next;
          });
        } finally {
          abortControllerRef.current = null;
          setIsStreaming(false);
          setChatMetrics({status: 'done', seconds: ((performance.now() - startedAt) / 1000).toFixed(1), completionTokens: Math.ceil(streamedText.length / 4)});
          fetchConversations();
          fetchAdminStatus();
        }
      };

      const cancelGeneration = () => abortControllerRef.current?.abort();

      const editMessage = (idx) => {
        if (isStreaming) return;
        // Editing creates a new branch so the old server-side history remains intact.
        setConversationId(null);
        setInputQuery(messages[idx].content);
        setEditingIndex(idx);
      };

      const copyMessage = async (content) => {
        try { await navigator.clipboard.writeText(content); } catch (e) { console.error('Copy failed', e); }
      };

      const regenerateMessage = (idx) => {
        if (isStreaming || idx < 1 || messages[idx - 1]?.role !== 'user') return;
        const question = messages[idx - 1].content;
        setConversationId(null);
        setMessages(prev => prev.slice(0, idx));
        setTimeout(() => handleSendMessage(null, question), 0);
      };

      const triggerSync = async (incremental = true) => {
        try {
          const res = await fetch(`/api/admin/sync?incremental=${incremental}`, { method: 'POST' });
          if (res.ok) {
            fetchAdminStatus();

          }

          alert(`Sync error: ${e.message}`);
        }
      };

      const triggerEmbed = async () => {
        try {
          const res = await fetch('/api/admin/embed', { method: 'POST' });
          if (res.ok) {
            fetchAdminStatus();
            alert(lang === 'th' ? "เริ่มการแปลงเวกเตอร์ในเบื้องหลังแล้ว!" : "Embedding job started in background!");
          }
        } catch (e) {
          alert(`Embed error: ${e.message}`);
        }
      };


      return (
        <div className="flex flex-col h-screen overflow-hidden bg-canvas text-body dark:bg-surface-dark dark:text-on-dark font-sans selection:bg-surface-cream-strong">
          
          {/* Top Navigation: 64px, Canvas background, Hairline bottom */}
          <header className="h-16 flex items-center justify-between px-6 border-b border-hairline dark:border-surface-dark-elevated bg-canvas dark:bg-surface-dark z-20">

              <div className="w-8 h-8 rounded-md bg-surface-card dark:bg-surface-dark-elevated text-primary flex items-center justify-center border border-hairline dark:border-surface-dark-soft">
                <AnthropicSpike className="w-5 h-5 text-primary" />
              </div>
              <div className="flex items-baseline gap-2">
                <h1 className="font-display text-2xl font-normal text-ink dark:text-on-dark tracking-tight">
                  {t.title}
                </h1>
                   <span className="text-[11px] font-mono uppercase tracking-widest text-muted font-medium">
                   Tensura Knowledge System
                </span>
              </div>
            </div>

            {/* Category / Nav Tabs */}
            <nav className="flex items-center gap-1 bg-surface-soft dark:bg-surface-dark-soft p-1 rounded-md border border-hairline-soft dark:border-surface-dark-elevated">
              <button 
                onClick={() => setTab('chat')}
                className={`px-3 py-1.5 rounded text-[13px] font-medium transition ${tab === 'chat' ? 'bg-canvas dark:bg-surface-dark text-ink dark:text-on-dark shadow-xs' : 'text-muted hover:text-ink dark:text-muted-soft dark:hover:text-on-dark'}`}
              >
                <i className="fa-solid fa-comments mr-1.5 text-xs opacity-70"></i>{t.chat}
              </button>
              <button 
                onClick={() => setTab('entities')}
                className={`px-3 py-1.5 rounded text-[13px] font-medium transition ${tab === 'entities' ? 'bg-canvas dark:bg-surface-dark text-ink dark:text-on-dark shadow-xs' : 'text-muted hover:text-ink dark:text-muted-soft dark:hover:text-on-dark'}`}
              >
                <i className="fa-solid fa-book-atlas mr-1.5 text-xs opacity-70"></i>{t.entities}
              </button>
              <button 
                onClick={() => { setTab('graph'); fetchGraphData(); }}
                className={`px-3 py-1.5 rounded text-[13px] font-medium transition ${tab === 'graph' ? 'bg-canvas dark:bg-surface-dark text-ink dark:text-on-dark shadow-xs' : 'text-muted hover:text-ink dark:text-muted-soft dark:hover:text-on-dark'}`}
              >

              <button

              >

              <button

              >
                <i className="fa-solid fa-sliders text-primary"></i>
                <span>{t.settings}</span>
              </button>
            </div>
          </header>

          {/* Main Body Stage */}
          <main className="flex-1 min-h-0 overflow-hidden relative">
            
            {/* TAB 1: CHAT */}
            {tab === 'chat' && (
               <div className="grid h-full min-h-0 workspace-grid">
                {/* Persistent conversation history */}
                <aside className="hidden md:flex w-64 min-h-0 flex-col overflow-hidden border-r border-hairline dark:border-surface-dark-elevated bg-surface-soft dark:bg-surface-dark-soft p-3">

                  </button>
                  <div className="flex gap-2 mb-3">
                    <button onClick={exportChat} className="flex-1 border border-hairline dark:border-surface-dark-elevated rounded-md py-1.5 text-[11px] text-muted dark:text-on-dark-soft hover:text-primary hover:border-primary transition"><i className="fa-solid fa-download mr-1"></i>{lang === 'th' ? 'ส่งออก' : 'Export'}</button>
                    <button onClick={clearChatHistory} className="flex-1 border border-hairline dark:border-surface-dark-elevated rounded-md py-1.5 text-[11px] text-muted dark:text-on-dark-soft hover:text-red-500 hover:border-red-400 transition"><i className="fa-solid fa-trash mr-1"></i>{lang === 'th' ? 'ล้างทั้งหมด' : 'Clear'}</button>
                  </div>
                  <div className="flex-1 min-h-0 overflow-y-auto overscroll-contain space-y-1 pr-1">
                    {historyLoading && <div className="text-xs text-muted p-2">Loading...</div>}
                    <input value={historySearch} onChange={e => setHistorySearch(e.target.value)} placeholder={lang === 'th' ? 'ค้นหาประวัติแชท...' : 'Search chat history...'} className="w-full mb-2 bg-canvas dark:bg-surface-dark border border-hairline dark:border-surface-dark-elevated rounded-md px-3 py-2 text-xs text-ink dark:text-on-dark" />
                    {conversations.filter(c => !historySearch.trim() || c.title.toLowerCase().includes(historySearch.toLowerCase())).map(c => (
                      <div key={c.id} className={`group flex items-center gap-1 rounded-md ${conversationId === c.id ? 'bg-canvas dark:bg-surface-dark' : 'hover:bg-canvas/70 dark:hover:bg-surface-dark/70'}`}>
                        <button onClick={() => openConversation(c.id)} className="flex-1 min-w-0 text-left px-3 py-2.5">
                          <div className="truncate text-[13px] font-medium text-ink dark:text-on-dark">{c.title}</div>
                          <div className="text-[10px] text-muted dark:text-on-dark-soft mt-0.5">{c.message_count || 0} messages</div>
                        </button>
                        <button onClick={() => renameConversation(c)} className="opacity-0 group-hover:opacity-100 px-1 text-muted hover:text-primary transition" title="Rename"><i className="fa-solid fa-pen text-[11px]"></i></button>
                        <button onClick={() => deleteConversation(c.id)} className="opacity-0 group-hover:opacity-100 px-2 text-muted hover:text-red-500 transition" title="Delete">
                          <i className="fa-solid fa-trash text-[11px]"></i>
                        </button>
                      </div>
                    ))}
                    {!conversations.length && !historyLoading && <div className="text-xs text-muted dark:text-on-dark-soft p-2">{lang === 'th' ? 'ยังไม่มีประวัติแชท' : 'No chat history yet'}</div>}
                  </div>
                </aside>
                {/* Chat Column */}
                <div className="flex-1 flex flex-col h-full min-h-0 bg-canvas dark:bg-surface-dark min-w-0">
                  <div className="h-14 px-5 md:px-8 border-b border-hairline dark:border-surface-dark-elevated flex items-center justify-between bg-canvas dark:bg-surface-dark">
                    <div>
                      <div className="font-display text-xl text-ink dark:text-on-dark">{t.chat}</div>
                      <div className="text-[10px] font-mono uppercase tracking-widest text-muted dark:text-on-dark-soft mt-0.5">Grounded answers · Thai / English</div>
                    </div>
                    <div className="hidden sm:flex items-center gap-2 text-[11px] text-muted dark:text-on-dark-soft">
                      <span className="w-1.5 h-1.5 rounded-full bg-success"></span>
                      <span>{settings.provider} / {settings.model}</span>
                      {chatMetrics?.status === 'running' && <span className="text-primary">· กำลังตอบ</span>}
                      {chatMetrics?.status === 'done' && <span>· {chatMetrics.completionTokens || 0} tokens · {chatMetrics.seconds}s</span>}
                    </div>
                  </div>
                  <div ref={messagesScrollRef} onScroll={handleMessagesScroll} className="flex-1 min-h-0 overflow-y-auto overscroll-contain p-4 md:p-8 space-y-6 max-w-4xl mx-auto w-full">
                    {messages.map((m, idx) => (
                      <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-2xl rounded-lg p-5 transition ${
                          m.role === 'user'
                            ? 'bg-primary text-on-primary shadow-sm rounded-br-none'
                            : 'bg-surface-card dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated text-body-strong dark:text-on-dark rounded-bl-none'
                        }`}>
                          <div className="flex items-center space-x-2 mb-2 opacity-80 text-xs font-mono uppercase tracking-wider">
                            {m.role === 'user' ? (
                              <>
                                <i className="fa-solid fa-user text-[11px]"></i>
                                <span>You</span>
                              </>
                            ) : (
                              <>
                                <AnthropicSpike className="w-3.5 h-3.5 text-primary" />
                                 <span className="font-semibold text-primary">WikiRAG / Knowledge Base</span>
                              </>
                            )}
                          </div>
                          
                          <div 
                            className="markdown-body text-[15px] leading-relaxed"
                            dangerouslySetInnerHTML={{ __html: marked.parse(m.content || '...') }}
                          />
                          {m.revisedAnswer && <div className="mt-4 border-l-2 border-primary pl-3"><div className="text-[10px] uppercase tracking-widest text-primary mb-1">คำตอบที่ปรับปรุงแล้ว</div><div className="markdown-body text-sm" dangerouslySetInnerHTML={{__html: marked.parse(m.revisedAnswer)}} /></div>}
                          {m.verification && <div className="mt-4 rounded-md border border-hairline dark:border-surface-dark-elevated p-3 text-xs"><div className="flex items-center justify-between"><span className="font-mono uppercase tracking-widest text-primary">ผลตรวจสอบ</span><span className="font-semibold">{m.verification.status === 'running' ? 'กำลังตรวจ...' : ({correct:'ถูกต้อง', partially_correct:'ถูกต้องบางส่วน', unsupported:'ไม่มีหลักฐานรองรับ', contradicted:'ขัดแย้งกับแหล่งข้อมูล', insufficient_evidence:'ข้อมูลไม่เพียงพอ'}[m.verification.overall] || 'ตรวจแล้ว')}</span></div>{m.verification.summary && <p className="mt-2 text-muted dark:text-on-dark-soft">{m.verification.summary}</p>}{m.verification.issues?.length > 0 && <div className="mt-2 space-y-1">{m.verification.issues.map((issue, i) => <div key={i} className="text-amber-600 dark:text-amber-300">• {issue.claim}: {issue.reason}</div>)}</div>}</div>}

                           {m.sources && m.sources.length > 0 && (
                            <div className="mt-4 pt-3 border-t border-hairline dark:border-surface-dark-elevated flex flex-wrap gap-1.5">

                                  href={s.url || '#'} 
                                  target="_blank" 
                                  rel="noopener noreferrer"
                                  onClick={(event) => { if (s.entity) { event.preventDefault(); fetchEntityDetail(s.entity); } }}
                                  className="inline-flex items-center text-xs font-mono bg-canvas dark:bg-surface-dark text-primary hover:text-primary-active border border-hairline dark:border-surface-dark-elevated px-2 py-1 rounded transition"

                           )}
                           <div className={`mt-3 pt-2 border-t border-hairline/60 dark:border-surface-dark-elevated/70 flex items-center gap-3 text-[11px] ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>

                                 {idx > 0 && !isStreaming && <button onClick={() => retryAssistantMessage(idx)} className="text-muted dark:text-on-dark-soft hover:text-primary transition flex items-center gap-1"><i className="fa-solid fa-rotate-right"></i><span>{m.content?.startsWith('Connection Error') ? (lang === 'th' ? 'ลองใหม่' : 'Retry') : (lang === 'th' ? 'สร้างคำตอบใหม่' : 'Regenerate')}</span></button>}
                              </>

                            {m.fallbackModel && <span className="text-amber-600 dark:text-amber-300">· Fallback: {m.fallbackModel}</span>}
                           </div>
                         </div>
                      </div>
                    ))}
                    <div ref={messagesEndRef} />
                  </div>

                  {/* Input Form: Text-input (40px, rounded.md, hairline border, focus coral) */}
                   <div className="p-4 md:p-6 border-t border-hairline dark:border-surface-dark-elevated bg-canvas dark:bg-surface-dark">
                     {editingIndex !== null && (
                       <div className="max-w-3xl mx-auto mb-2 flex items-center justify-between text-xs text-primary bg-primary/5 border border-primary/20 rounded-md px-3 py-2">
                         <span><i className="fa-solid fa-pen mr-2"></i>{lang === 'th' ? 'กำลังแก้ไขข้อความเดิม' : 'Editing previous message'}</span>
                         <button onClick={() => {setEditingIndex(null); setInputQuery('');}} className="text-muted hover:text-primary">ยกเลิก</button>
                       </div>
                     )}
                     <form onSubmit={handleSendMessage} className="max-w-3xl mx-auto flex items-center space-x-2">
                      <input 
                        type="text"
                        value={inputQuery}
                        onChange={(e) => setInputQuery(e.target.value)}
                        placeholder={t.placeholder}
                        disabled={isStreaming}
                        className="flex-1 bg-canvas dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md px-4 py-2.5 text-[15px] text-ink dark:text-on-dark focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition shadow-inner"
                      />
                      {isStreaming ? (
                        <button type="button" onClick={cancelGeneration} className="bg-surface-dark hover:bg-black text-on-dark font-medium px-5 h-10 rounded-md text-sm transition shadow-xs flex items-center space-x-2">

                        </button>
                      ) : (
                        <button type="submit" disabled={!inputQuery.trim()} className="bg-primary hover:bg-primary-active disabled:bg-primary-disabled disabled:text-muted text-on-primary font-medium px-5 h-10 rounded-md text-sm transition shadow-xs flex items-center space-x-2">
                          <span>{editingIndex !== null ? (lang === 'th' ? 'ส่งใหม่' : 'Send edit') : t.send}</span><i className="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                      )}
                    </form>
                  </div>
                </div>

                {/* Sources Transparency Panel (Dark Navy Product Surface) */}
                <div className="hidden lg:flex w-auto border-l border-hairline dark:border-surface-dark-elevated bg-surface-soft dark:bg-surface-dark-soft flex-col overflow-hidden">
                  <div className="h-12 px-4 border-b border-hairline dark:border-surface-dark-elevated flex items-center justify-between text-xs font-mono uppercase tracking-wider text-muted dark:text-on-dark-soft font-semibold">
                    <span className="flex items-center gap-2">
                      <i className="fa-solid fa-layer-group text-primary"></i>
                      {t.sources}
                    </span>

                      const isActive = adminStats.stage === step.key;
                      const isDone = (
                        (step.key === 'crawling' && ['parsing', 'embedding', 'completed'].includes(adminStats.stage)) ||
                        (step.key === 'parsing' && ['embedding', 'completed'].includes(adminStats.stage)) ||
                        (step.key === 'embedding' && adminStats.stage === 'completed') ||

                          className={`p-3 rounded-md border transition-all ${

                    </div>

                       <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">

                     <div className="text-[10px] font-mono uppercase tracking-widest text-primary">02A · Answer Verification</div>
                     <p className="text-[10px] text-muted dark:text-on-dark-soft">ปิดเป็นค่าเริ่มต้น ระบบจะตรวจคำตอบรอบที่สองและเก็บคำตอบแรกไว้เสมอ ใช้ Token และเวลาเพิ่ม</p>
                     <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">โหมดตรวจคำตอบ</label><select value={settings.verificationMode || 'off'} onChange={e => setSettings({...settings, verificationMode: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark"><option value="off">ปิด — ตอบครั้งเดียว</option><option value="verify_only">ตรวจสอบอย่างเดียว</option><option value="suggest">ตรวจสอบและเสนอคำตอบใหม่</option><option value="auto">ตรวจสอบและแก้ไขอัตโนมัติ</option></select></div>
                     {(settings.verificationMode || 'off') !== 'off' && <><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">ความเข้มงวด</label><select value={settings.verificationStrictness || 'balanced'} onChange={e => setSettings({...settings, verificationStrictness: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark"><option value="fast">เร็ว — ตรวจประเด็นหลัก</option><option value="balanced">สมดุล — แนะนำ</option><option value="detailed">ละเอียด — ตรวจทุกประโยค</option></select></div><div className="grid grid-cols-2 gap-2">{[['verifyNumbers','ตัวเลข/วันที่'],['verifyNames','ชื่อบุคคล'],['verifySkillRanks','ระดับสกิล'],['verifyRelationships','ความสัมพันธ์'],['verifyCitations','Citation'],['verifyUnsupported','ไม่มีหลักฐาน']].map(([key,label]) => <label key={key} className="flex items-center gap-2 text-[11px] text-ink dark:text-on-dark"><input type="checkbox" checked={settings[key] !== false} onChange={e => setSettings({...settings, [key]: e.target.checked})} className="accent-primary" />{label}</label>)}</div></>}
                   </div>

                   <div className="border-b border-hairline dark:border-surface-dark-elevated pb-2 pt-1">
                     <div className="text-[10px] font-mono uppercase tracking-widest text-primary">02 · Retrieval & Response</div>
                     <p className="text-muted dark:text-on-dark-soft mt-1">ควบคุมจำนวนข้อมูลและความยาวของคำตอบ</p>
                   </div>


                   <div>
                    <label className="block font-medium mb-1 text-ink dark:text-on-dark">{t.embeddingEngine}</label>
                    <select 
                      value={settings.embeddingBackend} 
                      onChange={(e) => setSettings({...settings, embeddingBackend: e.target.value})}
                      className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark focus:border-primary"
                    >
                      <option value="onnx">ONNX Runtime (Fast CPU, Recommended)</option>
                      <option value="default">Standard PyTorch</option>
                    </select>
                   </div>

                  <div>
                     <label className="block font-medium mb-1 text-ink dark:text-on-dark">Max Output Tokens: {settings.maxTokens}</label>
                     <input type="range" min="128" max="16384" step="128" value={settings.maxTokens || 4096}
                       onChange={(e) => setSettings({...settings, maxTokens: e.target.value})} className="w-full accent-primary" />
                     <div className="flex justify-between text-[10px] text-muted dark:text-on-dark-soft"><span>128</span><span>4,096</span><span>8,192</span><span>16,384</span></div>
                     <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">แนะนำ 4,096 สำหรับถามตอบทั่วไป · 8,192 สำหรับคำตอบละเอียด · 16,384 สำหรับสรุปหลายหัวข้อ (อาจช้าหรือใช้โควตาเพิ่ม)</p>
                   </div>

                  <div>
                    <label className="block font-medium mb-1 text-ink dark:text-on-dark">{t.quantization}</label>
                    <select 
                      value={settings.quantization} 
                      onChange={(e) => setSettings({...settings, quantization: e.target.value})}
                      className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark focus:border-primary"
                    >
                      <option value="int8">INT8 Quantized (~570MB, 4x smaller, 2x faster)</option>
                      <option value="none">Full Precision FP32 (~2.27GB)</option>
                    </select>
                  </div>

                  <details className="border border-hairline dark:border-surface-dark-elevated rounded-md p-3" open>
                    <summary className="cursor-pointer font-medium text-ink dark:text-on-dark">04 · ตั้งค่าขั้นสูง</summary>
                    <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1 mb-4">ค่าที่ละเอียดขึ้นสำหรับการปรับประสิทธิภาพ การแบ่งข้อมูล และการดึง Wiki</p>
                    <div className="space-y-4">
                      <div>
                        <label className="block font-medium mb-1 text-ink dark:text-on-dark">Embedding Model</label>
                        <input value={settings.embeddingModel || ''} onChange={(e) => setSettings({...settings, embeddingModel: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" />
                        <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">เปลี่ยนแล้วต้องสร้าง Embedding ใหม่ และต้องมีโมเดลอยู่ในเครื่อง</p>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Embedding Device</label><select value={settings.embeddingDevice || 'cpu'} onChange={(e) => setSettings({...settings, embeddingDevice: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark"><option value="cpu">CPU (แนะนำ)</option><option value="cuda">CUDA / NVIDIA GPU</option><option value="auto">Auto</option></select></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Embedding Batch Size: {settings.embeddingBatchSize || 8}</label><input type="range" min="1" max="64" step="1" value={settings.embeddingBatchSize || 8} onChange={(e) => setSettings({...settings, embeddingBatchSize: e.target.value})} className="w-full accent-primary" /><p className="text-[10px] text-muted dark:text-on-dark-soft">RAM น้อยให้ใช้ 1–8</p></div>
                      </div>
                      <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Reranker Model</label><input value={settings.rerankerModel || ''} onChange={(e) => setSettings({...settings, rerankerModel: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /><p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">โมเดลขนาดใหญ่อาจใช้ RAM มาก และถูกปิดไว้ตามค่าเริ่มต้น</p></div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Chunk ต่ำสุด</label><input type="number" min="100" value={settings.chunkMinTokens || 400} onChange={(e) => setSettings({...settings, chunkMinTokens: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Chunk สูงสุด</label><input type="number" min="100" value={settings.chunkMaxTokens || 800} onChange={(e) => setSettings({...settings, chunkMaxTokens: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Overlap %</label><input type="number" min="0" max="50" value={settings.chunkOverlap ?? 15} onChange={(e) => setSettings({...settings, chunkOverlap: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Crawler Batch</label><input type="number" min="1" value={settings.crawlerBatchSize || 50} onChange={(e) => setSettings({...settings, crawlerBatchSize: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Crawler Delay (วินาที)</label><input type="number" min="0" step="0.1" value={settings.crawlerDelay ?? 0.5} onChange={(e) => setSettings({...settings, crawlerDelay: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Checkpoint ทุก (หน้า)</label><input type="number" min="1" value={settings.crawlerCheckpoint || 100} onChange={(e) => setSettings({...settings, crawlerCheckpoint: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                      </div>
                      <div className="space-y-2"><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Storage: Data Directory</label><input value={settings.storageDataDir || ''} onChange={(e) => setSettings({...settings, storageDataDir: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /></div><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Storage: Vector Database</label><input value={settings.storageVectorDir || ''} onChange={(e) => setSettings({...settings, storageVectorDir: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /></div><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Storage: Raw Data</label><input value={settings.storageRawDir || ''} onChange={(e) => setSettings({...settings, storageRawDir: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /></div><p className="text-[10px] text-muted dark:text-on-dark-soft">การเปลี่ยนตำแหน่งต้อง Restart server และย้ายข้อมูลด้วยตนเอง</p></div>
                      <button type="button" onClick={resetAdvancedSettings} className="w-full border border-hairline dark:border-surface-dark-elevated text-muted hover:text-ink dark:hover:text-on-dark py-2 rounded-md">คืนค่าการตั้งค่าขั้นสูง</button>
                    </div>
                  </details>

                  <div>
                     <label className="block font-medium mb-1 text-ink dark:text-on-dark">{t.topK}: {settings.topK} <span className="text-muted dark:text-on-dark-soft font-normal">(สูงสุด 96)</span></label>
                    <input 
                      type="range" 
                      min="1" 
                       max="96"
                      value={settings.topK} 
                      onChange={(e) => setSettings({...settings, topK: e.target.value})}
                       className="w-full accent-primary"
                     />
                     <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">ค่าแนะนำ 5–10 · สูงสุด 96 · ค่าสูงจะใช้ context, RAM และเวลาเพิ่มขึ้น</p>
                  </div>

                   <div className="flex items-center justify-between py-1">
                    <span className="font-medium text-ink dark:text-on-dark">{t.enableRerank}</span>
                    <input 
                      type="checkbox" 
                      checked={settings.enableReranking === true}
                      onChange={(e) => setSettings({...settings, enableReranking: e.target.checked})}
                      className="rounded accent-primary"
                    />
                   </div>
                   <p className="text-[10px] text-muted dark:text-on-dark-soft">Reranker ใช้ RAM สูงมาก (โมเดลประมาณ 2.27 GB) ค่าเริ่มต้นปิด และต้องตั้งค่า WIKIRAG_ALLOW_LARGE_RERANKER=1 ก่อนเปิดใช้งาน</p>

                   <div className="border-b border-hairline dark:border-surface-dark-elevated pb-2 pt-1">
                     <div className="text-[10px] font-mono uppercase tracking-widest text-primary">03 · Embedding Runtime</div>
                     <p className="text-muted dark:text-on-dark-soft mt-1">ระบบใช้ BGE-M3 ONNX INT8 local ประมาณ 543 MB เพื่อประหยัด RAM</p>
                   </div>

                  <div className="flex items-center justify-between py-1">
                    <span className="font-medium text-ink dark:text-on-dark">{t.enableBM25}</span>
                    <input 
                      type="checkbox" 
                      checked={settings.enableBM25} 
                      onChange={(e) => setSettings({...settings, enableBM25: e.target.checked})}
                      className="rounded accent-primary"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-hairline dark:border-surface-dark-elevated">
                  <div className="flex gap-2 mb-3">
                    <button onClick={exportSettings} className="flex-1 border border-hairline dark:border-surface-dark-elevated rounded-md py-2 text-xs text-muted dark:text-on-dark-soft hover:text-primary hover:border-primary transition"><i className="fa-solid fa-download mr-1"></i>Export</button>
                    <button onClick={() => settingsFileInputRef.current?.click()} className="flex-1 border border-hairline dark:border-surface-dark-elevated rounded-md py-2 text-xs text-muted dark:text-on-dark-soft hover:text-primary hover:border-primary transition"><i className="fa-solid fa-upload mr-1"></i>Import</button>
                    <input ref={settingsFileInputRef} type="file" accept="application/json" onChange={importSettings} className="hidden" />
                  </div>
                  <button 
                    onClick={handleSaveSettings}
                    className="w-full bg-primary hover:bg-primary-active text-on-primary font-medium py-2.5 rounded-md shadow-xs transition text-sm"
                  >
                    {t.save}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer (Dark Navy Surface) with Mandatory CC BY-SA 3.0 Attribution */}
          <footer className="h-10 px-6 border-t border-hairline dark:border-surface-dark-elevated bg-surface-dark text-on-dark-soft text-[11px] font-sans flex items-center justify-between z-20">
            <div className="flex items-center gap-2">
              <AnthropicSpike className="w-3.5 h-3.5 text-primary" />
              <span>WikiRAG &middot; Tensura Knowledge System</span>
            </div>
            <span>{t.licenseNotice}</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
