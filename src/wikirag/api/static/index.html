    .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.75rem; }

      font-family: 'Cormorant Garamond', serif; 
      font-weight: 500; 
      margin-top: 1rem; 
      margin-bottom: 0.5rem;

    }
    .dark .markdown-body h1, .dark .markdown-body h2, .dark .markdown-body h3 {
      color: #faf9f5;
    }
    .markdown-body strong { color: #141413; font-weight: 600; }
    .dark .markdown-body strong { color: #ffffff; }
    .markdown-body a { color: #a9583e; text-decoration: underline; text-underline-offset: 2px; }
    .dark .markdown-body a { color: #e8a55a; }
    input::placeholder { color: #6c6a64; opacity: 1; }
    .dark input::placeholder { color: #b8b4aa; opacity: 1; }
    .markdown-body code { 
      font-family: 'JetBrains Mono', monospace; 
      background: #efe9de; 
      color: #141413;
      padding: 0.15rem 0.35rem;

    }

    @media (max-width: 1100px) { .workspace-grid { grid-template-columns: 224px minmax(0, 1fr); } }

<body class="bg-canvas text-body dark:bg-surface-dark dark:text-on-dark transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Anthropic signature 4-spoke starburst / radial spike icon
    const AnthropicSpike = ({ className = "w-4 h-4 fill-current" }) => (
      <svg viewBox="0 0 24 24" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
    );

    const I18N = {
      en: {
        title: "WikiRAG",
        subtitle: "Tensura Knowledge Base",
        chat: "Chat & Ask",
        entities: "Entity Browser",
        graph: "Knowledge Graph",
        admin: "Admin & Sync",
        settings: "Settings",
        placeholder: "Ask about Rimuru, skills, Tempest, or lore (Thai or English)...",
        send: "Send",
        sources: "Sources & Provenance",
        score: "Score",
        noEntities: "No entities loaded yet. Run sync to index pages.",
        syncNow: "Trigger Incremental Sync",
        syncFull: "Full Crawl & Sync",
        syncStatus: "Ingestion Status",
        totalArticles: "Wiki Articles",
        totalChunks: "Indexed Chunks",
        llmProvider: "LLM Provider",
        modelName: "Model Name",
        apiKey: "API Key (OpenRouter / OpenAI / Gemini)",
        embeddingEngine: "Embedding Engine",
        quantization: "Model Quantization",
        topK: "Top-K Chunks",
        enableRerank: "Enable Cross-Encoder Reranker",
        enableBM25: "Enable BM25 Hybrid Search",
        temperature: "Temperature",
        save: "Save Settings",
        licenseNotice: "Content derived from Tensura Fandom Wiki under CC BY-SA 3.0 license.",
        searchEntity: "Search entities...",
        viewDetail: "View Infobox",
        embedOnly: "Embed & Index Chunks",
        crawledPages: "Crawled Pages",
        parsedEntities: "Entities Extracted",
        cachedEmbeddings: "Cached Vectors (Disk)",
        relationships: "Knowledge Relations",
        stageTitle: "Current Pipeline Stage",
        pipelineStages: "Pipeline Stages",
      },
      th: {
        title: "WikiRAG",
        subtitle: "ฐานความรู้ Tensura & ระบบ RAG อัจฉริยะ",
        chat: "ถาม-ตอบ (Chat)",
        entities: "สำรวจตัวละคร (Entities)",
        graph: "โครงข่ายความสัมพันธ์ (Graph)",
        admin: "ผู้ดูแลระบบ (Sync)",
        settings: "ตั้งค่าระบบ",
        placeholder: "ถามคำถามเกี่ยวกับริมุรุ สกิล หรือเนื้อเรื่อง (ภาษาไทยหรืออังกฤษก็ได้)...",
        send: "ส่งคำถาม",
        sources: "แหล่งที่มาและคะแนนอ้างอิง",
        score: "คะแนน",
        noEntities: "ยังไม่มีข้อมูลตัวละคร กรุณากด Sync เพื่อดึงข้อมูล",
        syncNow: "เริ่ม Sync อัปเดตข้อมูล (Incremental)",
        syncFull: "ดึงข้อมูลใหม่ทั้งหมด (Full)",
        embedOnly: "เริ่มแปลงเวกเตอร์ (Embed & Index)",
        crawledPages: "หน้าที่ดึงแล้ว (Crawled)",
        parsedEntities: "ตัวละคร/หน้าที่แยกแล้ว",
        cachedEmbeddings: "เวกเตอร์ในแคช (Disk)",
        relationships: "ความสัมพันธ์ในกราฟ",
        stageTitle: "ขั้นตอนการทำงานปัจจุบัน",
        pipelineStages: "ขั้นตอนการประมวลผล",
        syncStatus: "สถานะการดึงข้อมูล",
        totalArticles: "บทความทั้งหมด",
        totalChunks: "เวกเตอร์ในระบบ (LanceDB)",
        llmProvider: "ผู้ให้บริการ LLM",
        modelName: "ชื่อโมเดล",
        apiKey: "API Key (OpenRouter / OpenAI / Gemini)",
        embeddingEngine: "ระบบประมวลผล Embedding",
        quantization: "การบีบอัดโมเดล (Quantization)",
        topK: "จำนวน Chunks ที่ค้นหา (Top-K)",
        enableRerank: "เปิดใช้งาน Reranker จัดอันดับซ้ำ",
        enableBM25: "เปิดใช้งาน BM25 ค้นหาแบบไฮบริด",
        temperature: "ความสร้างสรรค์ (Temperature)",
        save: "บันทึกการตั้งค่า",
        licenseNotice: "ข้อมูลดึงมาจาก Tensura Fandom Wiki ภายใต้สัญญาอนุญาต CC BY-SA 3.0",
        searchEntity: "ค้นหาตัวละคร / หน้า...",
        viewDetail: "ดูข้อมูล Infobox",
      }
    };

    function App() {
      const [lang, setLang] = useState('th');
      const [darkMode, setDarkMode] = useState(false);
      const [tab, setTab] = useState('chat'); // 'chat' | 'entities' | 'graph' | 'admin'
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      // Settings state (with localStorage persistence)
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('wikirag_settings');
        if (saved) {
          try { const parsed = JSON.parse(saved); return {...parsed, enableReranking: false,
            embeddingModel: parsed.embeddingModel || 'BAAI/bge-m3', embeddingDevice: parsed.embeddingDevice || 'cpu', embeddingBatchSize: parsed.embeddingBatchSize || 8,
            rerankerModel: parsed.rerankerModel || 'BAAI/bge-reranker-v2-m3', chunkMinTokens: parsed.chunkMinTokens || 400, chunkMaxTokens: parsed.chunkMaxTokens || 800,
            chunkOverlap: parsed.chunkOverlap ?? 15, crawlerBatchSize: parsed.crawlerBatchSize || 50, crawlerDelay: parsed.crawlerDelay ?? 0.5,
            crawlerCheckpoint: parsed.crawlerCheckpoint || 100, storageDataDir: parsed.storageDataDir || './data/tensura',
            storageVectorDir: parsed.storageVectorDir || './data/tensura/vectordb', storageRawDir: parsed.storageRawDir || './data/tensura/raw'}; } catch (e) {}
        }
        return {
          provider: 'openrouter',
          model: 'minimax/minimax-m3:free',
           apiKey: '',
           baseUrl: '',
          embeddingBackend: 'onnx',
          quantization: 'int8',
          topK: 5,
          enableReranking: false,
          enableBM25: false,
           temperature: 0.1,
           maxTokens: 1024,
          systemPrompt: '',
          embeddingModel: 'BAAI/bge-m3',
          embeddingDevice: 'cpu',
          embeddingBatchSize: 8,
          rerankerModel: 'BAAI/bge-reranker-v2-m3',
          chunkMinTokens: 400,
          chunkMaxTokens: 800,
          chunkOverlap: 15,
          crawlerBatchSize: 50,
          crawlerDelay: 0.5,
          crawlerCheckpoint: 100,
          storageDataDir: './data/tensura',
          storageVectorDir: './data/tensura/vectordb',
          storageRawDir: './data/tensura/raw',
        };
      });

      const [conversations, setConversations] = useState([]);
      const [conversationId, setConversationId] = useState(null);
      const [historyLoading, setHistoryLoading] = useState(false);

      const fetchConversations = async () => {
        try {
          const res = await fetch('/api/conversations?project=tensura');
          if (res.ok) setConversations(await res.json());
        } catch (e) { console.error('Failed to load chat history', e); }
      };

      const createNewChat = async () => {
        try {
          const res = await fetch('/api/conversations', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({project: 'tensura', title: lang === 'th' ? 'แชทใหม่' : 'New chat', llm_provider: settings.provider, llm_model: settings.model})
          });
          if (!res.ok) throw new Error('Failed to create conversation');
          const data = await res.json();
          setConversationId(data.id);
          setMessages([]); setActiveSources([]);
          fetchConversations();
        } catch (e) { console.error(e); }
      };

      const openConversation = async (id) => {
        setHistoryLoading(true);
        try {
          const res = await fetch(`/api/conversations/${encodeURIComponent(id)}`);
          if (!res.ok) throw new Error('Failed to load conversation');
          const data = await res.json();
          setConversationId(data.id);
          setMessages((data.messages || []).map(m => ({role: m.role, content: m.content, sources: m.citations || []})));
          setActiveSources([]);
          setTab('chat');
        } catch (e) { console.error(e); }
        finally { setHistoryLoading(false); }
      };

      const deleteConversation = async (id) => {
        if (!confirm(lang === 'th' ? 'ลบประวัติแชทนี้หรือไม่?' : 'Delete this chat?')) return;
        await fetch(`/api/conversations/${encodeURIComponent(id)}`, {method: 'DELETE'});
        if (conversationId === id) createNewChat();
        fetchConversations();
      };

      const handleSaveSettings = async () => {
        const numericSettings = {
          embeddingBatchSize: Number(settings.embeddingBatchSize),
          chunkMinTokens: Number(settings.chunkMinTokens),
          chunkMaxTokens: Number(settings.chunkMaxTokens),
          chunkOverlap: Number(settings.chunkOverlap),
          crawlerBatchSize: Number(settings.crawlerBatchSize),
          crawlerDelay: Number(settings.crawlerDelay),
          crawlerCheckpoint: Number(settings.crawlerCheckpoint),
        };
        if (numericSettings.embeddingBatchSize < 1 || numericSettings.embeddingBatchSize > 64 ||
            numericSettings.chunkMinTokens < 100 || numericSettings.chunkMaxTokens < numericSettings.chunkMinTokens ||
            numericSettings.chunkOverlap < 0 || numericSettings.chunkOverlap > 50 ||
            numericSettings.crawlerBatchSize < 1 || numericSettings.crawlerDelay < 0 || numericSettings.crawlerCheckpoint < 1) {
          alert(lang === 'th' ? 'กรุณาตรวจสอบค่าขั้นสูง: ตัวเลขอยู่นอกช่วงหรือ Chunk ต่ำ/สลับช่วง' : 'Please check advanced settings: invalid numeric range or chunk size.');
          return;
        }
        const embeddingChanged = settings.embeddingModel !== (settings._savedEmbeddingModel || 'BAAI/bge-m3') || settings.embeddingDevice !== (settings._savedEmbeddingDevice || 'cpu');
        const storageChanged = settings.storageDataDir !== './data/tensura' || settings.storageVectorDir !== './data/tensura/vectordb';
        if ((embeddingChanged || storageChanged) && !confirm(lang === 'th'
          ? 'การเปลี่ยน Embedding Model/Device หรือ Storage อาจทำให้ต้อง Restart และสร้างดัชนีใหม่ ต้องการบันทึกต่อหรือไม่?'
          : 'Changing Embedding Model/Device or Storage may require a restart and re-index. Save anyway?')) return;
        const nextSettings = {...settings, ...numericSettings, _savedEmbeddingModel: settings.embeddingModel, _savedEmbeddingDevice: settings.embeddingDevice};
        localStorage.setItem('wikirag_settings', JSON.stringify(nextSettings));
        try {
          await fetch('/api/settings?project=tensura', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(nextSettings)});
        } catch (e) { console.error('Failed to persist settings', e); }
        try {
          await fetch('/api/settings/embedding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              backend: settings.embeddingBackend,
              quantization: settings.quantization,
              model_name: settings.embeddingModel,
              device: settings.embeddingDevice,
              batch_size: numericSettings.embeddingBatchSize,
            })
          });
        } catch (e) {
          console.error("Failed to update embedding settings", e);
        }
        setIsSettingsOpen(false);
      };

      const resetAdvancedSettings = () => {
        if (!confirm(lang === 'th' ? 'คืนค่าการตั้งค่าขั้นสูงเป็นค่าเริ่มต้นหรือไม่?' : 'Reset advanced settings to defaults?')) return;
        setSettings({...settings, embeddingModel: 'BAAI/bge-m3', embeddingDevice: 'cpu', embeddingBatchSize: 8,
          rerankerModel: 'BAAI/bge-reranker-v2-m3', chunkMinTokens: 400, chunkMaxTokens: 800, chunkOverlap: 15,
          crawlerBatchSize: 50, crawlerDelay: 0.5, crawlerCheckpoint: 100,
          storageDataDir: './data/tensura', storageVectorDir: './data/tensura/vectordb', storageRawDir: './data/tensura/raw'});
      };


      // Chat state
      const [messages, setMessages] = useState([
        {
          role: 'assistant',
          content: lang === 'th' 
            ? "ยินดีต้อนรับสู่ **WikiRAG** ฐานความรู้วรรณกรรมและข้อมูลเชิงลึกของ *That Time I Got Reincarnated as a Slime* (Tensura)\n\nคุณสามารถสอบถามประวัติศาสตร์ตัวละคร พลังสกิล ความสัมพันธ์ หรือเหตุการณ์สำคัญในเรื่องเป็นภาษาไทยหรืออังกฤษได้เลยครับ"
            : "Welcome to **WikiRAG** — the editorial knowledge partner for *That Time I Got Reincarnated as a Slime* (Tensura).\n\nFeel free to explore characters, skill evolutions, alliances, or lore in Thai or English.",
          sources: []
        }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [isStreaming, setIsStreaming] = useState(false);
      const [activeSources, setActiveSources] = useState([]);
      const [editingIndex, setEditingIndex] = useState(null);
      const abortControllerRef = useRef(null);
      const messagesEndRef = useRef(null);

      // Entity Explorer state
      const [entities, setEntities] = useState([]);
      const [searchEntityText, setSearchEntityText] = useState('');
      const [selectedEntity, setSelectedEntity] = useState(null);
      const [loadingEntities, setLoadingEntities] = useState(false);

      // Admin stats
      const [adminStats, setAdminStats] = useState({
        is_syncing: false,
        status_message: "Idle",
        total_articles: 3403,
        total_chunks: 0,
      });

      // Knowledge Graph state & Canvas
      const [graphData, setGraphData] = useState({ nodes: [], edges: [] });
      const [graphLoading, setGraphLoading] = useState(false);
      const canvasRef = useRef(null);

      const t = I18N[lang];

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      useEffect(() => {
        fetchAdminStatus();
        fetchEntities();
        fetchConversations();
        fetch('/api/settings?project=tensura').then(r => r.ok ? r.json() : {}).then(saved => {
          if (Object.keys(saved).length) setSettings(prev => ({...prev, ...saved, enableReranking: false}));
        }).catch(() => {});
      }, []);

      useEffect(() => {
        let interval;
        if (adminStats.is_syncing) {
          interval = setInterval(() => {
            fetchAdminStatus();
          }, 1500);
        }
        return () => {
          if (interval) clearInterval(interval);
        };
      }, [adminStats.is_syncing]);

      // Keep knowledge views fresh after background sync/embed jobs complete.
      useEffect(() => {
        if (tab !== 'entities' && tab !== 'graph') return;
        const refresh = () => tab === 'entities' ? fetchEntities(undefined, true) : fetchGraphData(true);
        const interval = setInterval(refresh, 15000);
        return () => clearInterval(interval);
      }, [tab]);


      const fetchAdminStatus = async () => {
        try {
          const res = await fetch('/api/admin/status');
          if (res.ok) {
            const data = await res.json();
            setAdminStats(data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const fetchEntities = async (category, silent = false) => {
        if (!silent) setLoadingEntities(true);
        try {
          const query = category ? `&category=${encodeURIComponent(category)}` : '';
          const url = `/api/entities?limit=500${query}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            setEntities(data);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoadingEntities(false);
        }
      };

      const fetchEntityDetail = async (name) => {
        try {
          const res = await fetch(`/api/entities/${encodeURIComponent(name)}`);
          if (res.ok) {
            const data = await res.json();
            setSelectedEntity(data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const fetchGraphData = async (silent = false) => {
        if (!silent) setGraphLoading(true);
        try {
          const res = await fetch('/api/graph?limit=120');
          if (res.ok) {
            const data = await res.json();
            setGraphData(data);
          }
        } catch (e) {
          console.error("Failed to fetch graph data", e);
        } finally {
          setGraphLoading(false);
        }
      };

      // Lightweight force simulation for graph
      useEffect(() => {
        if (tab !== 'graph' || !canvasRef.current || graphData.nodes.length === 0) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let width = (canvas.width = canvas.parentElement.clientWidth);
        let height = (canvas.height = canvas.parentElement.clientHeight);

        const nodes = graphData.nodes.map((n, i) => ({
          ...n,
          x: width / 2 + (Math.random() - 0.5) * (width * 0.7),
          y: height / 2 + (Math.random() - 0.5) * (height * 0.7),
          vx: 0,
          vy: 0,
          radius: n.entity_type === 'character' ? 14 : 10,
          color: n.entity_type === 'character' ? '#cc785c' : n.entity_type === 'location' ? '#e8a55a' : '#5db8a6'
        }));

        const nodeMap = new Map(nodes.map(n => [n.id, n]));
        const edges = graphData.edges
          .map(e => ({ ...e, sourceNode: nodeMap.get(e.source), targetNode: nodeMap.get(e.target) }))
          .filter(e => e.sourceNode && e.targetNode);

        let animationId;
        const render = () => {
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              let dx = nodes[j].x - nodes[i].x;
              let dy = nodes[j].y - nodes[i].y;
              let dist = Math.sqrt(dx * dx + dy * dy) || 1;
              if (dist < 120) {
                let force = (120 - dist) / 120 * 0.5;
                nodes[i].vx -= (dx / dist) * force;
                nodes[i].vy -= (dy / dist) * force;
                nodes[j].vx += (dx / dist) * force;
                nodes[j].vy += (dy / dist) * force;
              }
            }
          }

          for (const e of edges) {
            let dx = e.targetNode.x - e.sourceNode.x;
            let dy = e.targetNode.y - e.sourceNode.y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 1;
            let force = (dist - 80) * 0.01;
            e.sourceNode.vx += (dx / dist) * force;
            e.sourceNode.vy += (dy / dist) * force;
            e.targetNode.vx -= (dx / dist) * force;
            e.targetNode.vy -= (dy / dist) * force;
          }

          for (const n of nodes) {
            n.x += n.vx;
            n.y += n.vy;
            n.vx *= 0.85;
            n.vy *= 0.85;
            n.x = Math.max(n.radius, Math.min(width - n.radius, n.x));
            n.y = Math.max(n.radius, Math.min(height - n.radius, n.y));
          }

          ctx.clearRect(0, 0, width, height);

          ctx.lineWidth = 1;
          for (const e of edges) {
            ctx.strokeStyle = darkMode ? 'rgba(230,223,216,0.15)' : 'rgba(20,20,19,0.12)';
            ctx.beginPath();
            ctx.moveTo(e.sourceNode.x, e.sourceNode.y);
            ctx.lineTo(e.targetNode.x, e.targetNode.y);
            ctx.stroke();

            let midX = (e.sourceNode.x + e.targetNode.x) / 2;
            let midY = (e.sourceNode.y + e.targetNode.y) / 2;
            ctx.fillStyle = darkMode ? '#a09d96' : '#6c6a64';
            ctx.font = '10px Inter, sans-serif';
            ctx.fillText(e.relation_type, midX, midY);
          }

          for (const n of nodes) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius, 0, 2 * Math.PI);
            ctx.fillStyle = n.color;
            ctx.fill();
            ctx.strokeStyle = darkMode ? '#181715' : '#faf9f5';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = darkMode ? '#faf9f5' : '#141413';
            ctx.font = '500 11px Inter, sans-serif';
            ctx.fillText(n.name, n.x + n.radius + 5, n.y + 4);
          }

          animationId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationId);
      }, [tab, graphData, darkMode]);

      // Handle Streaming Chat via SSE
      const handleSendMessage = async (e, overrideQuery = null) => {
        e?.preventDefault();
        const candidateQuery = overrideQuery !== null ? overrideQuery : inputQuery;
        if (!candidateQuery.trim() || isStreaming) return;

        const userMsg = candidateQuery.trim();
        setInputQuery('');
        if (editingIndex !== null) {
          setMessages(prev => [...prev.slice(0, editingIndex), { role: 'user', content: userMsg }]);
          setEditingIndex(null);
        } else {
          setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
        }
        setIsStreaming(true);
        setActiveSources([]);

        setMessages(prev => [...prev, { role: 'assistant', content: '', sources: [] }]);

        try {
          abortControllerRef.current = new AbortController();
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: abortControllerRef.current.signal,
              body: JSON.stringify({
                message: userMsg,
                conversation_id: conversationId,
              project: 'tensura',
              llm_provider: settings.provider,
               llm_model: settings.model,
               api_key: settings.apiKey || undefined,
               base_url: settings.baseUrl || undefined,
               max_output_tokens: parseInt(settings.maxTokens) || 1024,
               system_prompt: settings.systemPrompt || undefined,
              top_k: parseInt(settings.topK),
              enable_reranking: settings.enableReranking,
              enable_bm25: settings.enableBM25,
              reranker_model: settings.rerankerModel || undefined,
              temperature: parseFloat(settings.temperature),
            })

          });

          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';
          let currentSources = [];

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n');
            buffer = lines.pop();

            for (const block of lines) {
              if (!block.trim()) continue;
              const matchEvent = block.match(/event:\s*(\w+)/);
              const matchData = block.match(/data:\s*(.+)/s);

              const eventType = matchEvent ? matchEvent[1] : 'message';
              const eventData = matchData ? matchData[1] : '';

              if (eventType === 'sources') {
                try {
                  currentSources = JSON.parse(eventData);
                  setActiveSources(currentSources);
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1].sources = currentSources;
                    return next;
                  });
                } catch (err) {
                  console.error("Failed to parse sources", err);
                  }
              } else if (eventType === 'conversation') {
                try { setConversationId(JSON.parse(eventData).id); fetchConversations(); } catch (err) { console.error(err); }
              } else if (eventType === 'token') {
                try {
                  const tokenObj = JSON.parse(eventData);
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1].content += tokenObj.token;
                    return next;
                  });
                } catch (err) {
                  console.error("Token parse error", err);
                }
              } else if (eventType === 'error') {
                try {
                  const errObj = JSON.parse(eventData);
                  setMessages(prev => {
                    const next = [...prev];
                    next[next.length - 1].content += `\n\n*(Error: ${errObj.error})*`;
                    return next;
                  });
                } catch (e) {}
              }
            }
          }
        } catch (error) {
          if (error.name === 'AbortError') {
            setMessages(prev => {
              const next = [...prev];
              if (next.length && next[next.length - 1].role === 'assistant') next[next.length - 1].content += '\n\n*(หยุดการตอบแล้ว)*';
              return next;
            });
            return;
          }
          setMessages(prev => {
            const next = [...prev];
            next[next.length - 1].content = `Connection Error: ${error.message}`;
            return next;
          });
        } finally {
          abortControllerRef.current = null;
          setIsStreaming(false);
          fetchConversations();
          fetchAdminStatus();
        }
      };

      const cancelGeneration = () => abortControllerRef.current?.abort();

                         placeholder={settings.provider === 'openrouter' ? 'sk-or-v1-...' : 'API Key...'}
                         onChange={(e) => setSettings({...settings, apiKey: e.target.value})}
                         className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark focus:border-primary font-mono text-[11px]" />
                       <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">
                         {settings.provider === 'openrouter' && <span>รับคีย์ฟรีหรือเติมเครดิตได้ที่ <a href="https://openrouter.ai/keys" target="_blank" rel="noreferrer" className="text-primary underline">openrouter.ai/keys</a></span>}
                       </p>
                     </div>
                   )}

                   {(settings.provider === 'lmstudio' || settings.provider === 'openai' || settings.provider === 'openrouter') && (
                     <div>
                       <label className="block font-medium mb-1 text-ink dark:text-on-dark">API Base URL</label>
                       <input type="text" value={settings.baseUrl || ''} onChange={(e) => setSettings({...settings, baseUrl: e.target.value})}
                         placeholder={settings.provider === 'lmstudio' ? 'http://localhost:1234/v1' : 'ใช้ค่าเริ่มต้นของ provider'}
                         className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark focus:border-primary font-mono text-[11px]" />
                     </div>
                   )}

                   <div>
                     <label className="block font-medium mb-1 text-ink dark:text-on-dark">บุคลิกและคำสั่ง AI</label>
                     <textarea value={settings.systemPrompt || ''}
                       onChange={(e) => setSettings({...settings, systemPrompt: e.target.value})}
                       placeholder="เช่น คุณคือผู้ช่วย Tensura ที่สุภาพ เป็นกันเอง และตอบโดยอ้างอิงเฉพาะข้อมูลใน Knowledge Base..."
                       rows="6"
                       className="w-full resize-y bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-3 text-[12px] leading-relaxed text-ink dark:text-on-dark focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" />
                     <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">ใช้กำหนดโทนภาษา รูปแบบคำตอบ และกฎการตอบของ AI สำหรับโปรเจกต์นี้</p>
                   </div>

                   <div className="border-b border-hairline dark:border-surface-dark-elevated pb-2 pt-1">
                     <div className="text-[10px] font-mono uppercase tracking-widest text-primary">02 · Retrieval & Response</div>
                     <p className="text-muted dark:text-on-dark-soft mt-1">ควบคุมจำนวนข้อมูลและความยาวของคำตอบ</p>
                   </div>


                   <div>
                    <label className="block font-medium mb-1 text-ink dark:text-on-dark">{t.embeddingEngine}</label>
                    <select 
                      value={settings.embeddingBackend} 
                      onChange={(e) => setSettings({...settings, embeddingBackend: e.target.value})}
                      className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark focus:border-primary"
                    >
                      <option value="onnx">ONNX Runtime (Fast CPU, Recommended)</option>
                      <option value="default">Standard PyTorch</option>
                    </select>
                   </div>

                  <div>
                     <label className="block font-medium mb-1 text-ink dark:text-on-dark">Max Output Tokens: {settings.maxTokens}</label>
                     <input type="range" min="128" max="16384" step="128" value={settings.maxTokens || 4096}
                       onChange={(e) => setSettings({...settings, maxTokens: e.target.value})} className="w-full accent-primary" />
                     <div className="flex justify-between text-[10px] text-muted dark:text-on-dark-soft"><span>128</span><span>4,096</span><span>8,192</span><span>16,384</span></div>
                     <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">แนะนำ 4,096 สำหรับถามตอบทั่วไป · 8,192 สำหรับคำตอบละเอียด · 16,384 สำหรับสรุปหลายหัวข้อ (อาจช้าหรือใช้โควตาเพิ่ม)</p>
                   </div>

                  <div>
                    <label className="block font-medium mb-1 text-ink dark:text-on-dark">{t.quantization}</label>
                    <select 
                      value={settings.quantization} 
                      onChange={(e) => setSettings({...settings, quantization: e.target.value})}
                      className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark focus:border-primary"
                    >
                      <option value="int8">INT8 Quantized (~570MB, 4x smaller, 2x faster)</option>
                      <option value="none">Full Precision FP32 (~2.27GB)</option>
                    </select>
                  </div>

                  <details className="border border-hairline dark:border-surface-dark-elevated rounded-md p-3" open>
                    <summary className="cursor-pointer font-medium text-ink dark:text-on-dark">04 · ตั้งค่าขั้นสูง</summary>
                    <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1 mb-4">ค่าที่ละเอียดขึ้นสำหรับการปรับประสิทธิภาพ การแบ่งข้อมูล และการดึง Wiki</p>
                    <div className="space-y-4">
                      <div>
                        <label className="block font-medium mb-1 text-ink dark:text-on-dark">Embedding Model</label>
                        <input value={settings.embeddingModel || ''} onChange={(e) => setSettings({...settings, embeddingModel: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" />
                        <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">เปลี่ยนแล้วต้องสร้าง Embedding ใหม่ และต้องมีโมเดลอยู่ในเครื่อง</p>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Embedding Device</label><select value={settings.embeddingDevice || 'cpu'} onChange={(e) => setSettings({...settings, embeddingDevice: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark"><option value="cpu">CPU (แนะนำ)</option><option value="cuda">CUDA / NVIDIA GPU</option><option value="auto">Auto</option></select></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Embedding Batch Size: {settings.embeddingBatchSize || 8}</label><input type="range" min="1" max="64" step="1" value={settings.embeddingBatchSize || 8} onChange={(e) => setSettings({...settings, embeddingBatchSize: e.target.value})} className="w-full accent-primary" /><p className="text-[10px] text-muted dark:text-on-dark-soft">RAM น้อยให้ใช้ 1–8</p></div>
                      </div>
                      <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Reranker Model</label><input value={settings.rerankerModel || ''} onChange={(e) => setSettings({...settings, rerankerModel: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /><p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">โมเดลขนาดใหญ่อาจใช้ RAM มาก และถูกปิดไว้ตามค่าเริ่มต้น</p></div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Chunk ต่ำสุด</label><input type="number" min="100" value={settings.chunkMinTokens || 400} onChange={(e) => setSettings({...settings, chunkMinTokens: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Chunk สูงสุด</label><input type="number" min="100" value={settings.chunkMaxTokens || 800} onChange={(e) => setSettings({...settings, chunkMaxTokens: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Overlap %</label><input type="number" min="0" max="50" value={settings.chunkOverlap ?? 15} onChange={(e) => setSettings({...settings, chunkOverlap: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Crawler Batch</label><input type="number" min="1" value={settings.crawlerBatchSize || 50} onChange={(e) => setSettings({...settings, crawlerBatchSize: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Crawler Delay (วินาที)</label><input type="number" min="0" step="0.1" value={settings.crawlerDelay ?? 0.5} onChange={(e) => setSettings({...settings, crawlerDelay: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                        <div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Checkpoint ทุก (หน้า)</label><input type="number" min="1" value={settings.crawlerCheckpoint || 100} onChange={(e) => setSettings({...settings, crawlerCheckpoint: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 text-ink dark:text-on-dark" /></div>
                      </div>
                      <div className="space-y-2"><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Storage: Data Directory</label><input value={settings.storageDataDir || ''} onChange={(e) => setSettings({...settings, storageDataDir: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /></div><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Storage: Vector Database</label><input value={settings.storageVectorDir || ''} onChange={(e) => setSettings({...settings, storageVectorDir: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /></div><div><label className="block font-medium mb-1 text-ink dark:text-on-dark">Storage: Raw Data</label><input value={settings.storageRawDir || ''} onChange={(e) => setSettings({...settings, storageRawDir: e.target.value})} className="w-full bg-surface-soft dark:bg-surface-dark-soft border border-hairline dark:border-surface-dark-elevated rounded-md p-2 font-mono text-[11px] text-ink dark:text-on-dark" /></div><p className="text-[10px] text-muted dark:text-on-dark-soft">การเปลี่ยนตำแหน่งต้อง Restart server และย้ายข้อมูลด้วยตนเอง</p></div>
                      <button type="button" onClick={resetAdvancedSettings} className="w-full border border-hairline dark:border-surface-dark-elevated text-muted hover:text-ink dark:hover:text-on-dark py-2 rounded-md">คืนค่าการตั้งค่าขั้นสูง</button>
                    </div>
                  </details>

                  <div>
                     <label className="block font-medium mb-1 text-ink dark:text-on-dark">{t.topK}: {settings.topK} <span className="text-muted dark:text-on-dark-soft font-normal">(สูงสุด 30)</span></label>
                    <input 
                      type="range" 
                      min="1" 
                       max="30" 
                      value={settings.topK} 
                      onChange={(e) => setSettings({...settings, topK: e.target.value})}
                       className="w-full accent-primary"
                     />
                     <p className="text-[10px] text-muted dark:text-on-dark-soft mt-1">ค่าแนะนำ 5–10 · ค่าสูงจะค้นข้อมูลมากขึ้นแต่ใช้ context และเวลาเพิ่มขึ้น</p>
                  </div>

                   <div className="flex items-center justify-between py-1">
                    <span className="font-medium text-ink dark:text-on-dark">{t.enableRerank}</span>
                    <input 
                      type="checkbox" 
                      checked={false} 
                      disabled={true}
                      onChange={(e) => setSettings({...settings, enableReranking: e.target.checked})}
                      className="rounded accent-primary"
                    />
                   </div>

                   <div className="border-b border-hairline dark:border-surface-dark-elevated pb-2 pt-1">
                     <div className="text-[10px] font-mono uppercase tracking-widest text-primary">03 · Embedding Runtime</div>
                     <p className="text-muted dark:text-on-dark-soft mt-1">ระบบใช้ BGE-M3 ONNX INT8 local ประมาณ 543 MB เพื่อประหยัด RAM</p>
                   </div>

                  <div className="flex items-center justify-between py-1">
                    <span className="font-medium text-ink dark:text-on-dark">{t.enableBM25}</span>
                    <input 
                      type="checkbox" 
                      checked={settings.enableBM25} 
                      onChange={(e) => setSettings({...settings, enableBM25: e.target.checked})}
                      className="rounded accent-primary"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-hairline dark:border-surface-dark-elevated">
                  <button 
                    onClick={handleSaveSettings}
                    className="w-full bg-primary hover:bg-primary-active text-on-primary font-medium py-2.5 rounded-md shadow-xs transition text-sm"
                  >
                    {t.save}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer (Dark Navy Surface) with Mandatory CC BY-SA 3.0 Attribution */}
          <footer className="h-10 px-6 border-t border-hairline dark:border-surface-dark-elevated bg-surface-dark text-on-dark-soft text-[11px] font-sans flex items-center justify-between z-20">
            <div className="flex items-center gap-2">
              <AnthropicSpike className="w-3.5 h-3.5 text-primary" />
              <span>WikiRAG &middot; Tensura Knowledge System</span>
            </div>
            <span>{t.licenseNotice}</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
